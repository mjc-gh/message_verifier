name: message_verifier
on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.89", stable]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --all-targets
      - run: cargo test --doc

  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  rails:
    name: ActiveSupport ${{ matrix.activesupport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.1"
            activesupport: "7.0.8.7"
          - ruby: "3.3"
            activesupport: "7.2.3.1"
          - ruby: "3.4"
            activesupport: "8.1.4"
    env:
      ACTIVESUPPORT_VERSION: ${{ matrix.activesupport }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install activesupport --version "$ACTIVESUPPORT_VERSION" --no-document
      - run: gem install json --version "~> 2.0" --no-document
      - run: cargo test --test rails -- --ignored
